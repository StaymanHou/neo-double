[project]
name = "neo-sensor"
version = "0.1.0"
description = "Neo's fenced sensor layer: channel ingest, redaction-at-rest, and the only read path to the corpus."
requires-python = ">=3.12,<3.13"
dependencies = [
    "en-core-web-lg",
    "httpx>=0.27",
    "msal>=1.37.0",
    "presidio-analyzer~=2.2",
    "presidio-anonymizer~=2.2",
    "pydantic>=2.9",
    # The Telegram read path. Same library the predecessor used, so the session file format and
    # the `<chat_id>:<message_id>` external_id shape stay the ones this corpus already holds.
    "telethon~=1.36",
]

[project.scripts]
neo-corpus = "neo_sensor.corpus_cli:main"
neo-channels = "neo_sensor.corpus_cli:channels_main"
neo-fetch = "neo_sensor.graph_fetch:main"
# The send path, added 2026-08-24. Separate entry point rather than a `neo-fetch` verb: `pull`,
# `enrich` and `reclassify` all move data INTO the fenced store, and egress sharing their command
# name would make "which of these can talk to other people" a thing you have to remember.
neo-send = "neo_sensor.telegram_send:main"
# Outlook reply-all, added 2026-09-22 — same gate, imported from telegram_send, not restated.
neo-mail = "neo_sensor.graph_send:main"

[build-system]
requires = ["uv_build>=0.8,<0.9"]
build-backend = "uv_build"

[tool.uv]
package = true

[tool.uv.build-backend]
module-name = "neo_sensor"
module-root = ""

[tool.uv.sources]
en-core-web-lg = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_lg-3.8.0/en_core_web_lg-3.8.0-py3-none-any.whl" }

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.7"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S608"]
# S608 fires on every query here, because the fence predicates ARE interpolated — that is the
# design (one `EMITTABLE` composed into each read, so a verb cannot forget it). Nothing from
# the caller is ever interpolated: user values are bound as `?` parameters without exception,
# which `test_sql_helpers_bind_rather_than_interpolate` pins. Left on, the rule fired 10 times
# before this was written, which is how a real 11th would have gone unread.
"neo_sensor/corpus_cli.py" = ["S608"]
